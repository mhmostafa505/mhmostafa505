name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # Runs once daily at 03:00 UTC
  workflow_dispatch: # Lets you run it manually from the Actions tab
  push:
    paths:
      - ".github/workflows/profile-readme.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: stats
          options: "username=${{ github.repository_owner }}&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&card_width=440"
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate top languages card
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: top-langs
          options: "username=${{ github.repository_owner }}&layout=compact&theme=tokyonight&hide_border=true&langs_count=8&card_width=440"
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate pin card - Quera-Bootcamp-Project-02
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: "username=${{ github.repository_owner }}&repo=Quera-Bootcamp-Project-02&theme=tokyonight&hide_border=true"
          path: profile/pin-quera-02.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Generate pin card - Tweeter_Demo
        uses: soulteary/github-readme-stats-action@v1.0.0
        with:
          card: pin
          options: "username=Soroush-Eghdami&repo=Tweeter_Demo&theme=tokyonight&hide_border=true"
          path: profile/pin-tweeter-demo.svg
          token: ${{ secrets.STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git pull --no-rebase -X ours origin main
          git push
